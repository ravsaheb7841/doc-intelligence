version: '3.8'

services:
  # ============ MONGODB ============
  mongodb:
    image: mongo:7
    container_name: docintel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=doc_intelligence
    networks:
      - docintel-network

  # ============ BACKEND ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - MONGO_DB_NAME=doc_intelligence
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost
      - MAX_FILE_SIZE=52428800
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/processed:/app/processed
      - ./backend/vectordb:/app/vectordb
    depends_on:
      - mongodb
    networks:
      - docintel-network

  # ============ FRONTEND ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8000
    container_name: docintel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - docintel-network

volumes:
  mongodb_data:
    driver: local

networks:
  docintel-network:
    driver: bridge